name: Run Weekly Toggl Report

on:
  repository_dispatch:
    types: [Toggl_automation]

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run the report script
      run: python3 weekly_report_bot.py
